<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness Preview</title>
<style>
:root {
  --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#222; --border:#2a2a2a;
  --text:#e0e0e0; --muted:#666; --accent:#6c8ebf;
  --strength:#f59e0b; --cardio:#38bdf8; --sport:#10b981; --rest:#6b7280;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
button{font-family:inherit;}

/* Nav */
.site-nav{display:flex;align-items:center;gap:20px;padding:8px 32px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:13px;}
.site-nav-brand{font-weight:700;letter-spacing:.1em;font-size:13px;color:var(--accent);text-decoration:none;margin-right:8px;}
.site-nav-links{display:flex;gap:4px;}
.site-nav-links a{color:var(--muted);text-decoration:none;padding:4px 10px;border-radius:5px;}
.site-nav-links a.active{color:var(--text);background:var(--surface);}

/* Header */
header{display:flex;align-items:center;gap:16px;padding:14px 32px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:100;}
header h1{font-size:17px;font-weight:700;letter-spacing:.08em;margin-right:auto;}
.view-toggle{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.view-toggle button{background:none;border:none;color:var(--muted);padding:6px 16px;cursor:pointer;font-size:13px;transition:all .15s;}
.view-toggle button.active{background:var(--accent);color:#fff;}
.month-nav{display:flex;gap:6px;align-items:center;}
.month-nav button{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:13px;}
.month-nav button:hover{border-color:var(--accent);}
#monthLabel{font-size:13px;color:var(--muted);min-width:90px;text-align:center;}
.demo-badge{background:rgba(108,142,191,.15);border:1px solid var(--accent);color:var(--accent);font-size:11px;padding:3px 9px;border-radius:4px;}

/* Stats */
.stats-bar{display:flex;gap:24px;padding:10px 32px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;}
.stat{display:flex;flex-direction:column;gap:2px;}
.slabel{color:var(--muted);font-size:10px;letter-spacing:.05em;text-transform:uppercase;}
.svalue{font-size:17px;font-weight:700;}

/* Calendar */
#calWrap{padding:20px 32px;}
.cal-grid-header{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;}
.cal-wd{text-align:center;font-size:11px;color:var(--muted);padding:4px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-cell{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 8px;min-height:76px;cursor:pointer;transition:border-color .15s;position:relative;}
.cal-cell:hover{border-color:var(--accent);}
.cal-cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
.cal-cell.other-month{opacity:.25;pointer-events:none;}
.cal-date{font-size:12px;color:var(--muted);margin-bottom:4px;}
.cal-date.today-num{color:var(--accent);font-weight:700;}
.cal-workouts{display:flex;flex-direction:column;gap:2px;}
.cal-chip{font-size:10px;padding:1px 5px;border-radius:3px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-chip.strength{background:rgba(245,158,11,.15);color:var(--strength);}
.cal-chip.cardio{background:rgba(56,189,248,.15);color:var(--cardio);}
.cal-chip.sport{background:rgba(16,185,129,.15);color:var(--sport);}
.cal-chip.rest{background:rgba(107,114,128,.15);color:var(--rest);}
.cal-load{position:absolute;bottom:4px;right:6px;font-size:10px;color:var(--muted);}

/* Plan */
#planWrap{display:none;padding:20px 32px;}
.section-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;}
.plan-section{margin-bottom:32px;}
.comp-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:8px;display:flex;align-items:center;gap:16px;}
.comp-card.past{opacity:.45;}
.comp-name{font-size:15px;font-weight:700;flex:1;}
.comp-meta{font-size:12px;color:var(--muted);margin-top:2px;}
.comp-countdown{text-align:right;}
.comp-days{font-size:24px;font-weight:800;color:var(--accent);line-height:1;}
.comp-days-label{font-size:11px;color:var(--muted);}
.week-row{display:grid;grid-template-columns:72px 1fr 56px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);}
.week-row:last-child{border-bottom:none;}
.week-lbl{font-size:12px;color:var(--muted);}
.load-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.load-fill{height:100%;border-radius:3px;}
.week-load{font-size:12px;color:var(--muted);text-align:right;}
.chart-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;overflow-x:auto;}

/* Trends */
#trendsWrap{display:none;padding:20px 32px;}
.trend-tabs{display:flex;gap:6px;margin-bottom:20px;}
.trend-tab{padding:5px 14px;border:1px solid var(--border);border-radius:5px;background:none;color:var(--muted);font-size:12px;cursor:pointer;}
.trend-tab.active{border-color:var(--accent);color:var(--accent);background:rgba(108,142,191,.1);}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px;}
.metric-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;}
.mlabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.mvalue{font-size:22px;font-weight:800;}
.mdelta{font-size:11px;color:var(--muted);margin-top:3px;}
.chart-section{margin-bottom:28px;}
.chart-title{font-size:14px;font-weight:700;margin-bottom:3px;}
.chart-sub{font-size:12px;color:var(--muted);margin-bottom:12px;}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;justify-content:center;align-items:center;padding:20px;}
.modal-overlay.open{display:flex;}
.day-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:100%;max-width:520px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;}
.day-panel-header{padding:20px 20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0;}
.day-panel-date{font-size:16px;font-weight:700;}
.day-panel-wd{font-size:12px;color:var(--muted);margin-top:3px;}
.close-btn{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;}
.day-panel-body{overflow-y:auto;flex:1;padding:12px 20px;}
.day-panel-foot{border-top:1px solid var(--border);padding:14px 20px;flex-shrink:0;}
.add-trigger{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;border:1px dashed var(--border);border-radius:8px;background:none;color:var(--muted);font-size:13px;cursor:pointer;}
.add-trigger:hover{border-color:var(--accent);color:var(--accent);}
.entry-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;}
.entry-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.entry-time{font-size:12px;color:var(--muted);min-width:42px;}
.entry-metrics{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:4px;}
.entry-note{font-size:13px;color:var(--text);line-height:1.6;margin-top:4px;}

@media(max-width:768px){
  header{padding:8px 16px;}
  #calWrap,#planWrap,#trendsWrap{padding:12px 16px;}
  .cal-cell{min-height:56px;padding:4px 5px;}
  .stats-bar{padding:8px 16px;gap:16px;overflow-x:auto;flex-wrap:nowrap;}
  .stats-bar::-webkit-scrollbar{display:none;}
  .metric-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<!-- Nav -->
<div class="site-nav">
  <a class="site-nav-brand" href="#">Life</a>
  <div class="site-nav-links">
    <a href="#">Life Log</a>
    <a href="#" class="active">Fitness</a>
    <a href="#">Assets</a>
  </div>
</div>

<!-- Header -->
<header>
  <h1>Fitness</h1>
  <div class="view-toggle">
    <button id="btnCal"    class="active" onclick="switchView('cal')">Calendar</button>
    <button id="btnPlan"   onclick="switchView('plan')">Plan</button>
    <button id="btnTrends" onclick="switchView('trends')">Trends</button>
  </div>
  <div class="month-nav" id="monthNav">
    <button onclick="changeMonth(-1)">‹</button>
    <span id="monthLabel">2026 6月</span>
    <button onclick="changeMonth(1)">›</button>
  </div>
  <span class="demo-badge">Preview Mode</span>
</header>

<!-- Stats Bar -->
<div class="stats-bar">
  <div class="stat"><span class="slabel">本月場次</span><span class="svalue" id="sS">—</span></div>
  <div class="stat"><span class="slabel">本月時長</span><span class="svalue" id="sD">—</span></div>
  <div class="stat"><span class="slabel" style="color:var(--strength)">重訓</span><span class="svalue" id="sSt">—</span></div>
  <div class="stat"><span class="slabel" style="color:var(--cardio)">有氧</span><span class="svalue" id="sCa">—</span></div>
  <div class="stat"><span class="slabel" style="color:var(--sport)">運動</span><span class="svalue" id="sSp">—</span></div>
  <div class="stat"><span class="slabel">本週 Load</span><span class="svalue" id="sWL">—</span></div>
  <div class="stat"><span class="slabel">ACWR</span><span class="svalue" id="sAC" style="color:#10b981">—</span></div>
</div>

<!-- Calendar -->
<div id="calWrap">
  <div class="cal-grid-header">
    <div class="cal-wd">一</div><div class="cal-wd">二</div><div class="cal-wd">三</div>
    <div class="cal-wd">四</div><div class="cal-wd">五</div>
    <div class="cal-wd" style="color:var(--accent)">六</div>
    <div class="cal-wd" style="color:#ef4444">日</div>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</div>

<!-- Plan -->
<div id="planWrap">
  <div class="plan-section">
    <div class="section-title">目標比賽</div>
    <div id="compList"></div>
  </div>
  <div class="plan-section">
    <div class="section-title">近 12 週訓練負荷</div>
    <div class="chart-box" id="weekChart"></div>
  </div>
</div>

<!-- Trends -->
<div id="trendsWrap">
  <div class="trend-tabs">
    <button class="trend-tab active" id="t7"  onclick="setRange(7)">近 7 天</button>
    <button class="trend-tab"        id="t30" onclick="setRange(30)">近 30 天</button>
    <button class="trend-tab"        id="t90" onclick="setRange(90)">近 90 天</button>
  </div>
  <div class="metric-grid" id="metricGrid"></div>
  <div class="chart-section">
    <div class="chart-title">週訓練負荷</div>
    <div class="chart-sub">Load = 時長 × RPE，ACWR 安全區間 0.8–1.3</div>
    <div class="chart-box" id="loadBox"></div>
  </div>
  <div class="chart-section">
    <div class="chart-title">日訓練時長（分鐘）</div>
    <div class="chart-box" id="durBox"></div>
  </div>
</div>

<!-- Day Panel -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closePanel()">
  <div class="day-panel">
    <div class="day-panel-header">
      <div><div class="day-panel-date" id="pDate"></div><div class="day-panel-wd" id="pWd"></div></div>
      <button class="close-btn" onclick="closePanel()">×</button>
    </div>
    <div class="day-panel-body" id="pBody"></div>
    <div class="day-panel-foot">
      <button class="add-trigger">+ 新增訓練（Preview 模式不可儲存）</button>
    </div>
  </div>
</div>

<script>
// ── Sample Data ──
const MONTHS_C = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const MONTHS   = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD_C     = ['日','一','二','三','四','五','六'];
const TYPE_LBL = {strength:'重訓',cardio:'有氧',sport:'運動',rest:'休息'};

// Generate 10 weeks of realistic training data
function makeData() {
  const d = {};
  const base = new Date('2026-06-10');
  const plans = [
    // week patterns: [Mon..Sun] type/dur/rpe
    [null,{t:'strength',d:75,r:7,s:'Squat+Bench'},null,{t:'strength',d:70,r:6,s:'Deadlift'},{t:'cardio',d:45,r:6,s:'running',m:{distance:7.2,avgPace:'6:15',avgCadence:168,avgStrideLength:0.83,avgHR:152}},null,{t:'cardio',d:65,r:6,s:'running',m:{distance:10.5,avgPace:'6:20',avgCadence:166,avgStrideLength:0.82,avgHR:148}}],
    [null,{t:'strength',d:80,r:7,s:'Squat+OHP'},{t:'rest',d:0,r:0},  {t:'strength',d:70,r:7,s:'RDL+Row'}, {t:'cardio',d:50,r:7,s:'running',m:{distance:8.1,avgPace:'6:10',avgCadence:170,avgStrideLength:0.84,avgHR:155}},null,{t:'cardio',d:90,r:6,s:'running',m:{distance:14,avgPace:'6:26',avgCadence:164,avgStrideLength:0.81,avgHR:145}}],
    [{t:'strength',d:75,r:7,s:'Squat+Bench'},null,{t:'cardio',d:35,r:5,s:'running',m:{distance:5.5,avgPace:'6:22',avgCadence:165,avgStrideLength:0.82,avgHR:142}},{t:'strength',d:65,r:6,s:'Deadlift'},null,{t:'cardio',d:55,r:6,s:'running',m:{distance:8.8,avgPace:'6:17',avgCadence:169,avgStrideLength:0.83,avgHR:150}},null],
    [null,{t:'strength',d:85,r:8,s:'Squat PR 嘗試'}, null, {t:'strength',d:60,r:5,s:'輔助訓練'},{t:'cardio',d:60,r:7,s:'running',m:{distance:9.5,avgPace:'6:08',avgCadence:172,avgStrideLength:0.85,avgHR:158}},{t:'rest',d:0,r:0},{t:'cardio',d:120,r:6,s:'running',m:{distance:18,avgPace:'6:42',avgCadence:162,avgStrideLength:0.80,avgHR:143}}],
    [null,{t:'strength',d:75,r:7,s:'Squat+Bench'},null,{t:'strength',d:70,r:6,s:'Deadlift'},{t:'cardio',d:45,r:5,s:'running',m:{distance:6.8,avgPace:'6:30',avgCadence:164,avgStrideLength:0.80,avgHR:140}},null,{t:'cardio',d:35,r:4,s:'running',m:{distance:5.2,avgPace:'6:45',avgCadence:160,avgStrideLength:0.79,avgHR:134}}],
  ];

  for (let w=0; w<10; w++) {
    const plan = plans[w % plans.length];
    for (let dow=0; dow<7; dow++) {
      const day = new Date(base); day.setDate(base.getDate() - (9-w)*7 + dow);
      const k = `${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}-${String(day.getDate()).padStart(2,'0')}`;
      const p = plan[dow];
      if (!p || p.t==='rest') continue;
      d[k] = [{
        id: k+'-0', time: p.t==='cardio'?'07:30':'18:00',
        type: p.t, sport: p.s||'', duration: p.d, rpe: p.r,
        load: p.d*p.r, note: '', metrics: p.m||{}
      }];
    }
  }

  // this week: today's activity
  const todayK = '2026-06-10';
  d[todayK] = [{id:'t0',time:'07:30',type:'cardio',sport:'running',duration:35,rpe:6,load:210,note:'竹東鎮 - 訓練（今天的跑步）',metrics:{distance:4.03,avgPace:'8:39',avgCadence:140,avgStrideLength:0.82,avgHR:143,avgVerticalOscillation:7.48,avgGroundContactTime:264,avgVerticalRatio:9.82}}];

  return d;
}

const DATA = makeData();
const COMPS = [
  {id:'c1',date:'2026-09-21',name:'台北半程馬拉松',sport:'running'},
  {id:'c2',date:'2026-12-06',name:'台北馬拉松',sport:'running'},
];
const TODAY_STR = '2026-06-10';

let curYear=2026, curMonth=5, curView='cal', tRange=7;

function key(y,m,d){return`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}

// ── View Switch ──
function switchView(v){
  curView=v;
  document.getElementById('calWrap').style.display    = v==='cal'    ? '':'none';
  document.getElementById('planWrap').style.display   = v==='plan'   ? '':'none';
  document.getElementById('trendsWrap').style.display = v==='trends' ? '':'none';
  document.getElementById('monthNav').style.display   = v==='cal'    ? '':'none';
  ['Cal','Plan','Trends'].forEach(n=>
    document.getElementById('btn'+n).classList.toggle('active',n.toLowerCase()===v)
  );
  if(v==='cal')    switchView("trends");
  if(v==='plan')   renderPlan();
  if(v==='trends') renderTrends();
}

function changeMonth(d){
  curMonth+=d;
  if(curMonth<0){curMonth=11;curYear--;} if(curMonth>11){curMonth=0;curYear++;}
  switchView("trends");
}
function setRange(n){
  tRange=n;
  [7,30,90].forEach(r=>document.getElementById('t'+r).classList.toggle('active',r===n));
  renderTrends();
}

// ── Calendar ──
function renderCalendar(){
  document.getElementById('monthLabel').textContent=`${curYear} ${MONTHS_C[curMonth]}`;
  const grid=document.getElementById('calGrid'); grid.innerHTML='';
  const dim=new Date(curYear,curMonth+1,0).getDate();
  const dow0=(new Date(curYear,curMonth,1).getDay()+6)%7;
  const prevDim=new Date(curYear,curMonth,0).getDate();

  for(let i=dow0-1;i>=0;i--){
    const c=cel('other-month'); c.querySelector('.cal-date').textContent=prevDim-i; grid.appendChild(c);
  }
  for(let d=1;d<=dim;d++){
    const k=key(curYear,curMonth,d);
    const es=DATA[k]||[];
    const isToday=k===TODAY_STR;
    const c=cel(isToday?'today':'');
    c.querySelector('.cal-date').textContent=d;
    if(isToday) c.querySelector('.cal-date').classList.add('today-num');
    c.addEventListener('click',()=>openPanel(k));
    if(es.length){
      const chips=c.querySelector('.cal-workouts');
      const load=es.reduce((s,e)=>s+(e.load||0),0);
      es.slice(0,2).forEach(e=>{
        const ch=document.createElement('div');
        ch.className=`cal-chip ${e.type||'strength'}`;
        ch.textContent=TYPE_LBL[e.type||'strength']+(e.duration?` ${e.duration}'`:'');
        chips.appendChild(ch);
      });
      if(es.length>2){const m=document.createElement('div');m.className='cal-chip rest';m.textContent=`+${es.length-2}`;chips.appendChild(m);}
      if(load>0){const ld=c.querySelector('.cal-load');ld.textContent=load;}
    }
    grid.appendChild(c);
  }
  const total=dow0+dim;
  for(let d=1;d<=(7-total%7)%7;d++){
    const c=cel('other-month'); c.querySelector('.cal-date').textContent=d; grid.appendChild(c);
  }
  updateStats();
}

function cel(extraCls=''){
  const c=document.createElement('div');
  c.className='cal-cell'+(extraCls?' '+extraCls:'');
  c.innerHTML='<div class="cal-date"></div><div class="cal-workouts"></div><div class="cal-load"></div>';
  return c;
}

function updateStats(){
  const dim=new Date(curYear,curMonth+1,0).getDate();
  let sessions=0,dur=0; const ct={strength:0,cardio:0,sport:0};
  for(let d=1;d<=dim;d++){
    (DATA[key(curYear,curMonth,d)]||[]).forEach(e=>{sessions++;dur+=e.duration||0;if(e.type in ct)ct[e.type]++;});
  }
  // week load (7 days back from today)
  let wLoad=0; const base=new Date(TODAY_STR+'T00:00:00');
  for(let i=0;i<7;i++){const d=new Date(base);d.setDate(base.getDate()-i);const k=key(d.getFullYear(),d.getMonth(),d.getDate());(DATA[k]||[]).forEach(e=>wLoad+=e.load||0);}
  // 28-day ACWR
  let d28=0;
  for(let i=0;i<28;i++){const d=new Date(base);d.setDate(base.getDate()-i);const k=key(d.getFullYear(),d.getMonth(),d.getDate());(DATA[k]||[]).forEach(e=>d28+=e.load||0);}
  const acute=wLoad/7, chronic=d28/28;
  const acwr=chronic>0?(acute/chronic):null;

  document.getElementById('sS').textContent=sessions;
  document.getElementById('sD').textContent=dur+"'";
  document.getElementById('sSt').textContent=ct.strength;
  document.getElementById('sCa').textContent=ct.cardio;
  document.getElementById('sSp').textContent=ct.sport;
  document.getElementById('sWL').textContent=wLoad;
  const ac=document.getElementById('sAC');
  if(acwr!==null){
    ac.textContent=acwr.toFixed(2);
    ac.style.color=acwr<0.8?'var(--muted)':acwr<=1.3?'#10b981':'#ef4444';
  }
}

// ── Plan ──
function renderPlan(){
  // Competitions
  const cList=document.getElementById('compList'); cList.innerHTML='';
  COMPS.sort((a,b)=>a.date.localeCompare(b.date)).forEach(c=>{
    const dLeft=Math.ceil((new Date(c.date)-new Date(TODAY_STR))/86400000);
    const isPast=dLeft<0;
    const card=document.createElement('div'); card.className='comp-card'+(isPast?' past':'');
    card.innerHTML=`
      <div style="flex:1"><div class="comp-name">${c.name}</div><div class="comp-meta">${c.date} · ${c.sport}</div></div>
      <div class="comp-countdown">
        ${isPast?'<div class="comp-days" style="font-size:13px;font-weight:400;color:var(--muted)">已完成</div>':`<div class="comp-days">${dLeft}</div><div class="comp-days-label">天後</div>`}
      </div>`;
    cList.appendChild(card);
  });

  // 12-week bars
  const base=new Date(TODAY_STR+'T00:00:00');
  const wks=Array.from({length:12},(_,i)=>{
    const ref=new Date(base); ref.setDate(base.getDate()-(11-i)*7);
    const ws=new Date(ref); ws.setDate(ws.getDate()-(ws.getDay()||7)+1);
    const lbl=`${MONTHS[ws.getMonth()]}${ws.getDate()}`;
    let load=0;
    for(let d=0;d<7;d++){const dd=new Date(ws);dd.setDate(ws.getDate()+d);const k=key(dd.getFullYear(),dd.getMonth(),dd.getDate());(DATA[k]||[]).forEach(e=>load+=e.load||0);}
    return{lbl,load};
  });
  const maxL=Math.max(...wks.map(w=>w.load),1);
  const box=document.getElementById('weekChart'); box.innerHTML='';
  wks.forEach((w,i)=>{
    const row=document.createElement('div'); row.className='week-row';
    const fill_color=i===11?'var(--accent)':i>=8?'rgba(108,142,191,.5)':'rgba(108,142,191,.2)';
    row.innerHTML=`
      <div class="week-lbl">${w.lbl}</div>
      <div class="load-bar"><div class="load-fill" style="width:${w.load/maxL*100}%;background:${fill_color}"></div></div>
      <div class="week-load">${w.load||'—'}</div>`;
    box.appendChild(row);
  });
}

// ── Trends ──
function renderTrends(){
  const base=new Date(TODAY_STR+'T00:00:00');
  const days=Array.from({length:tRange},(_,i)=>{const d=new Date(base);d.setDate(base.getDate()-(tRange-1-i));return key(d.getFullYear(),d.getMonth(),d.getDate());});
  const flat=days.flatMap(k=>DATA[k]||[]);
  const sessions=flat.filter(e=>e.type!=='rest').length;
  const totalDur=flat.reduce((s,e)=>s+(e.duration||0),0);
  const totalLoad=flat.reduce((s,e)=>s+(e.load||0),0);
  const runEs=flat.filter(e=>e.type==='cardio'||e.sport==='running');
  const cadEs=runEs.filter(e=>e.metrics?.avgCadence);
  const hrEs=runEs.filter(e=>e.metrics?.avgHR);
  const slEs=runEs.filter(e=>e.metrics?.avgStrideLength);
  const avgCad=cadEs.length?Math.round(cadEs.reduce((s,e)=>s+e.metrics.avgCadence,0)/cadEs.length):null;
  const avgHR=hrEs.length?Math.round(hrEs.reduce((s,e)=>s+e.metrics.avgHR,0)/hrEs.length):null;
  const avgSL=slEs.length?(slEs.reduce((s,e)=>s+e.metrics.avgStrideLength,0)/slEs.length).toFixed(2):null;

  document.getElementById('metricGrid').innerHTML=[
    ['訓練場次',sessions,`${tRange} 天內`],
    ['總時長',totalDur+"'",'分鐘'],
    ['累積負荷',totalLoad,'Σ(min×RPE)'],
    ['平均步頻',avgCad??'—',avgCad?'spm':'尚無資料'],
    ['平均心率',avgHR??'—',avgHR?'bpm':'尚無資料'],
    ['平均步幅',avgSL??'—',avgSL?'m':'尚無資料'],
  ].map(([l,v,d])=>`<div class="metric-card"><div class="mlabel">${l}</div><div class="mvalue">${v}</div><div class="mdelta">${d}</div></div>`).join('');

  // Load chart (12 weeks)
  const wks=Array.from({length:12},(_,i)=>{
    const ref=new Date(base); ref.setDate(base.getDate()-(11-i)*7);
    const ws=new Date(ref); ws.setDate(ws.getDate()-(ws.getDay()||7)+1);
    let load=0;
    for(let d=0;d<7;d++){const dd=new Date(ws);dd.setDate(ws.getDate()+d);const k=key(dd.getFullYear(),dd.getMonth(),dd.getDate());(DATA[k]||[]).forEach(e=>load+=e.load||0);}
    return{lbl:`${MONTHS[ws.getMonth()]}${ws.getDate()}`,load};
  });
  const box=document.getElementById('loadBox'); box.innerHTML='';
  box.appendChild(barChart(wks.map(w=>w.lbl),wks.map(w=>w.load),{highlightLast:true,height:160}));

  // Duration chart
  const lbls=days.map(k=>{const d=new Date(k+'T00:00:00');return`${d.getMonth()+1}/${d.getDate()}`;});
  const durs=days.map(k=>(DATA[k]||[]).reduce((s,e)=>s+(e.duration||0),0));
  const clrs=days.map(k=>{const es=DATA[k]||[];if(!es.length)return'var(--border)';if(es.some(e=>e.type==='cardio'))return'var(--cardio)';if(es.some(e=>e.type==='strength'))return'var(--strength)';return'var(--sport)';});
  const dbox=document.getElementById('durBox'); dbox.innerHTML='';
  dbox.appendChild(barChart(lbls,durs,{colorArr:clrs,height:120,unit:"'"}));
}

function barChart(labels,values,opts={}){
  const{highlightLast=false,colorArr=null,height=140,unit=''}=opts;
  const n=labels.length, W=Math.max(n*38,280), H=height+36;
  const max=Math.max(...values,1), bw=Math.min(28,(W/n)-4);
  const ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('width','100%'); svg.style.minWidth=W+'px';
  labels.forEach((lbl,i)=>{
    const cx=(i+.5)*(W/n), v=values[i]||0, bh=(v/max)*height, by=height-bh;
    const fill=colorArr?colorArr[i]:highlightLast&&i===n-1?'var(--accent)':highlightLast&&i>=n-4?'rgba(108,142,191,.5)':'rgba(108,142,191,.25)';
    if(v>0){
      const r=document.createElementNS(ns,'rect');
      r.setAttribute('x',cx-bw/2);r.setAttribute('y',by);r.setAttribute('width',bw);r.setAttribute('height',bh);r.setAttribute('fill',fill);r.setAttribute('rx','3');svg.appendChild(r);
      if(bh>14){const t=document.createElementNS(ns,'text');t.setAttribute('x',cx);t.setAttribute('y',by+bh/2+4);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','9');t.setAttribute('fill','#fff');t.setAttribute('font-weight','600');t.textContent=v+unit;svg.appendChild(t);}
    }
    const lt=document.createElementNS(ns,'text');lt.setAttribute('x',cx);lt.setAttribute('y',height+14);lt.setAttribute('text-anchor','middle');lt.setAttribute('font-size','9');lt.setAttribute('fill','var(--muted)');lt.textContent=lbl;svg.appendChild(lt);
  });
  return svg;
}

// ── Day Panel ──
function openPanel(k){
  const es=DATA[k]||[];
  const[y,m,d]=k.split('-').map(Number);
  const isToday=k===TODAY_STR;
  document.getElementById('pDate').textContent=`${y}年${m}月${d}日${isToday?' · 今天':''}`;
  document.getElementById('pWd').textContent='週'+WD_C[new Date(y,m-1,d).getDay()];
  const body=document.getElementById('pBody'); body.innerHTML='';
  if(!es.length){
    const e=document.createElement('div');
    e.style.cssText='color:var(--muted);font-size:13px;padding:20px 0;text-align:center';
    e.textContent='今天沒有訓練紀錄。';body.appendChild(e);
  }
  es.forEach(entry=>{
    const card=document.createElement('div'); card.className='entry-card';
    const top=document.createElement('div'); top.className='entry-top';
    const time=document.createElement('div'); time.className='entry-time'; time.textContent=entry.time||'';
    const chip=document.createElement('div'); chip.className=`cal-chip ${entry.type||'strength'}`;
    chip.textContent=TYPE_LBL[entry.type||'strength']+(entry.sport?` · ${entry.sport}`:'');
    top.appendChild(time); top.appendChild(chip); card.appendChild(top);
    const mt=document.createElement('div'); mt.className='entry-metrics';
    const rows=[];
    if(entry.duration) rows.push(entry.duration+"'");
    if(entry.rpe)      rows.push(`RPE ${entry.rpe}`);
    if(entry.load)     rows.push(`Load ${entry.load}`);
    if(entry.metrics?.distance)        rows.push(`${entry.metrics.distance}km`);
    if(entry.metrics?.avgPace)         rows.push(`配速 ${entry.metrics.avgPace}`);
    if(entry.metrics?.avgCadence)      rows.push(`步頻 ${entry.metrics.avgCadence}spm`);
    if(entry.metrics?.avgStrideLength) rows.push(`步幅 ${entry.metrics.avgStrideLength}m`);
    if(entry.metrics?.avgHR)           rows.push(`心率 ${entry.metrics.avgHR}bpm`);
    if(entry.metrics?.avgVerticalOscillation) rows.push(`垂直振幅 ${entry.metrics.avgVerticalOscillation}cm`);
    if(entry.metrics?.avgGroundContactTime)   rows.push(`觸地時間 ${entry.metrics.avgGroundContactTime}ms`);
    rows.forEach(r=>{const s=document.createElement('span');s.textContent=r;mt.appendChild(s);});
    card.appendChild(mt);
    if(entry.note){const n=document.createElement('div');n.className='entry-note';n.textContent=entry.note;card.appendChild(n);}
    body.appendChild(card);
  });
  document.getElementById('modalOverlay').classList.add('open');
}
function closePanel(){document.getElementById('modalOverlay').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();});

// ── Init ──
switchView("trends");
</script>
