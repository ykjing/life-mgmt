<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fitness — Life</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<link rel="stylesheet" href="../shared/style.css">
<style>
:root {
  --cb: #f97316; --cr: #4b5563; --ci: #ef4444;
  --cs: #8b5cf6; --ce: #10b981; --cl: #3b82f6; --crace: #f59e0b;
}

/* ── View tabs ── */
.view-tabs { display:flex; border-bottom:1px solid var(--border); background:var(--bg); }
.view-tab { padding:.5rem 1.25rem; font-size:.85rem; cursor:pointer; border:none; background:none; color:var(--fg2); border-bottom:2px solid transparent; margin-bottom:-1px; font-family:inherit; }
.view-tab.active { color:var(--fg); border-bottom-color:var(--cl); }

/* ── Stats bar ── */
#stats-bar { display:flex; align-items:center; gap:1.5rem; padding:.45rem 1.25rem; background:var(--bg2); border-bottom:1px solid var(--border); font-size:.75rem; color:var(--fg2); flex-wrap:wrap; }
.stat { display:flex; flex-direction:column; align-items:center; min-width:56px; }
.stat-val { font-size:1rem; font-weight:700; color:var(--fg); }
#race-cntdwn { margin-left:auto; color:var(--crace); font-weight:700; font-size:.82rem; }

/* ── Main ── */
#main { padding:1rem 1.25rem; max-width:920px; margin:0 auto; }

/* ── LSD Progress ── */
.lsd-box { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:.85rem 1.1rem; margin-bottom:1.1rem; }
.lsd-box h3 { font-size:.7rem; text-transform:uppercase; letter-spacing:.07em; color:var(--fg2); margin:0 0 .7rem; }
.lsd-dots { display:flex; align-items:flex-end; gap:.5rem; }
.lsd-dot { flex:1; display:flex; flex-direction:column; align-items:center; gap:.2rem; cursor:pointer; }
.lsd-bar-area { width:100%; height:70px; display:flex; align-items:flex-end; }
.lsd-bar { width:100%; border-radius:4px 4px 0 0; background:var(--border); position:relative; transition:height .3s; }
.lsd-bar.done { background:var(--ce); }
.lsd-bar.current { background:var(--cl); }
.lsd-bar.recovery { background:var(--ce); opacity:.7; }
.lsd-bar.peak { background:var(--crace); }
.lsd-bar.taper { background:var(--cs); }
.lsd-bar.future { background:var(--border); }
.lsd-km { font-size:.72rem; font-weight:700; color:var(--fg); }
.lsd-wlabel { font-size:.6rem; color:var(--fg2); }
.lsd-actual-km { font-size:.62rem; color:var(--ce); font-weight:700; }

/* ── Week cards ── */
.week-card { background:var(--bg2); border:1px solid var(--border); border-radius:10px; margin-bottom:.6rem; overflow:hidden; }
.week-card.cur { border-color:var(--cl); }
.wk-hdr { display:flex; align-items:center; gap:.6rem; padding:.55rem .9rem; cursor:pointer; user-select:none; }
.wk-hdr:hover { background:var(--bg3); }
.wk-title { font-weight:700; font-size:.88rem; }
.wk-dates { font-size:.7rem; color:var(--fg2); }
.wk-phase { font-size:.65rem; padding:.12rem .45rem; border-radius:999px; margin-left:auto; }
.ph-build    { background:rgba(59,130,246,.15);  color:var(--cl); }
.ph-recovery { background:rgba(16,185,129,.15);  color:var(--ce); }
.ph-peak     { background:rgba(245,158,11,.15);  color:var(--crace); }
.ph-taper    { background:rgba(139,92,246,.15);  color:var(--cs); }
.ph-race     { background:rgba(245,158,11,.25);  color:var(--crace); }
.wk-lsd-tag { font-size:.7rem; color:var(--fg2); }
.wk-chev { color:var(--fg2); font-size:.8rem; transition:transform .2s; }
.week-card.open .wk-chev { transform:rotate(90deg); }
.wk-body { display:none; padding:.1rem .65rem .65rem; }
.week-card.open .wk-body { display:block; }
.wk-note { font-size:.72rem; color:var(--crace); background:rgba(245,158,11,.08); border:1px solid rgba(245,158,11,.2); border-radius:5px; padding:.3rem .55rem; margin-bottom:.5rem; }
.day-hdr-row { display:grid; grid-template-columns:repeat(7,1fr); gap:.45rem; margin-bottom:.25rem; }
.day-hdr { text-align:center; font-size:.62rem; color:var(--fg2); }

/* ── Day cells ── */
.day-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:.45rem; }
.dc {
  background:var(--bg3); border:1px solid transparent; border-radius:8px;
  padding:.45rem .35rem; min-height:78px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:.18rem; text-align:center;
  transition:border-color .15s;
}
.dc:hover { border-color:var(--fg2); }
.dc.today { border-color:var(--cl); background:rgba(59,130,246,.07); }
.dc.has-entry { border-color:rgba(34,197,94,.4); }
.dc-date { font-size:.62rem; color:var(--fg2); }
.dc-icon { font-size:1.15rem; }
.dc-label { font-size:.58rem; color:var(--fg2); line-height:1.2; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dc-badge { font-size:.57rem; padding:.05rem .28rem; border-radius:999px; background:rgba(34,197,94,.18); color:var(--ce); }
.dc-actual { font-size:.62rem; font-weight:600; color:var(--ce); }
.dc-bar { width:75%; height:3px; border-radius:2px; margin-top:auto; }
.dc.type-badminton .dc-bar { background:var(--cb); }
.dc.type-rest      .dc-bar { background:var(--cr); }
.dc.type-intervals .dc-bar { background:var(--ci); }
.dc.type-strength  .dc-bar { background:var(--cs); }
.dc.type-easy      .dc-bar { background:var(--ce); }
.dc.type-lsd       .dc-bar { background:var(--cl); }
.dc.type-race      .dc-bar { background:var(--crace); }

/* ── Calendar view ── */
.cal-nav { display:flex; align-items:center; gap:.75rem; margin-bottom:.85rem; }
.cal-nav h2 { flex:1; text-align:center; font-size:1rem; }
.cal-nav button { background:var(--bg2); border:1px solid var(--border); color:var(--fg); padding:.3rem .7rem; border-radius:6px; cursor:pointer; font-family:inherit; }
.cal-dow-row { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:3px; }
.cal-dow { text-align:center; font-size:.65rem; color:var(--fg2); padding:.25rem 0; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.cal-day { background:var(--bg2); border:1px solid var(--border); border-radius:6px; padding:.35rem .4rem; min-height:60px; cursor:pointer; }
.cal-day:hover { background:var(--bg3); }
.cal-day.today { border-color:var(--cl); }
.cal-day.dim { opacity:.3; pointer-events:none; }
.cal-day .dn { font-size:.7rem; color:var(--fg2); }
.cal-chips { display:flex; flex-wrap:wrap; gap:2px; margin-top:.2rem; }
.cc { font-size:.55rem; padding:.08rem .28rem; border-radius:3px; color:#fff; }

/* ── Trends view ── */
.metric-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:.65rem; margin-bottom:1.1rem; }
.mc { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:.7rem .9rem; }
.mc-lbl { font-size:.65rem; color:var(--fg2); }
.mc-val { font-size:1.3rem; font-weight:700; }
.mc-unit { font-size:.65rem; color:var(--fg2); }
.chart-box { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:.9rem 1.1rem; margin-bottom:.8rem; }
.chart-box h3 { font-size:.72rem; color:var(--fg2); margin:0 0 .65rem; text-transform:uppercase; letter-spacing:.06em; }
.chart-box svg { display:block; width:100%; overflow:visible; }

/* ── Panel ── */
#ov { position:fixed; inset:0; background:rgba(0,0,0,.82); backdrop-filter:blur(4px); z-index:900; display:none; }
#ov.open { display:block; }
#panel {
  position:fixed; right:0; top:0; bottom:0; width:min(460px,100vw);
  background:var(--bg2); border-left:1px solid var(--border);
  transform:translateX(100%); transition:transform .25s; z-index:901; display:flex; flex-direction:column;
}
#panel.open { transform:none; }
#phdr { display:flex; align-items:center; gap:.5rem; padding:.7rem .95rem; border-bottom:1px solid var(--border); }
#p-date { font-weight:700; }
#p-plan { font-size:.7rem; color:var(--fg2); }
#p-close { margin-left:auto; background:none; border:none; color:var(--fg2); font-size:1.1rem; cursor:pointer; }
#pbody { flex:1; overflow-y:auto; padding:.9rem; }
#pftr { padding:.65rem .95rem; border-top:1px solid var(--border); display:flex; gap:.45rem; }
.btn-p { flex:1; padding:.48rem; border-radius:6px; background:var(--cl); color:#fff; border:none; cursor:pointer; font-size:.82rem; font-weight:600; font-family:inherit; }
.btn-d { padding:.48rem .7rem; border-radius:6px; background:rgba(239,68,68,.15); color:#ef4444; border:none; cursor:pointer; font-size:.82rem; font-family:inherit; }
.btn-c { padding:.48rem .7rem; border-radius:6px; background:var(--bg3); color:var(--fg); border:1px solid var(--border); cursor:pointer; font-size:.82rem; font-family:inherit; }
.fr { margin-bottom:.65rem; }
.fr label { display:block; font-size:.7rem; color:var(--fg2); margin-bottom:.25rem; }
.fr input,.fr select,.fr textarea {
  width:100%; box-sizing:border-box; background:var(--bg3); border:1px solid var(--border);
  color:var(--fg); border-radius:6px; padding:.4rem .55rem; font-size:.82rem; font-family:inherit;
}
.fr textarea { resize:vertical; min-height:52px; }
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:.45rem; }
.rpe-row { display:flex; gap:.3rem; flex-wrap:wrap; }
.rb {
  width:1.9rem; height:1.9rem; border-radius:50%; border:1px solid var(--border);
  background:var(--bg3); color:var(--fg); cursor:pointer; font-size:.75rem;
  display:flex; align-items:center; justify-content:center; font-family:inherit;
}
.rb.on { background:var(--cl); border-color:var(--cl); color:#fff; }
.type-row { display:flex; gap:.35rem; flex-wrap:wrap; }
.tb { padding:.22rem .55rem; border-radius:999px; font-size:.72rem; cursor:pointer; border:1px solid var(--border); background:var(--bg3); color:var(--fg); font-family:inherit; }
.tb.on { color:#fff; border-color:transparent; }
.tb[data-v="badminton"].on { background:var(--cb); }
.tb[data-v="rest"].on      { background:var(--cr); }
.tb[data-v="intervals"].on { background:var(--ci); }
.tb[data-v="strength"].on  { background:var(--cs); }
.tb[data-v="easy"].on      { background:var(--ce); }
.tb[data-v="lsd"].on       { background:var(--cl); }
.tb[data-v="other"].on     { background:#6b7280; }
.stat-row { display:flex; gap:.4rem; }
.sb { flex:1; padding:.3rem; border-radius:6px; font-size:.7rem; cursor:pointer; border:1px solid var(--border); background:var(--bg3); color:var(--fg2); text-align:center; font-family:inherit; }
.sb.on.done { background:rgba(34,197,94,.15); border-color:var(--ce); color:var(--ce); }
.sb.on.skip { background:rgba(107,114,128,.15); border-color:#6b7280; color:#9ca3af; }
details.coll summary { cursor:pointer; font-size:.7rem; color:var(--fg2); list-style:none; display:flex; align-items:center; gap:.3rem; padding:.35rem 0; border-top:1px solid var(--border); margin-top:.4rem; }
details.coll summary::before { content:'▶'; font-size:.55rem; }
details.coll[open] summary::before { content:'▼'; }
.ex-list { list-style:none; padding:0; margin:.35rem 0 0; }
.ex-list li { display:flex; align-items:center; gap:.45rem; padding:.28rem 0; font-size:.78rem; border-bottom:1px solid var(--border); }
.ex-list li:last-child { border:none; }
.ex-list input[type="checkbox"] { width:auto; accent-color:var(--cl); }
.ex-sets { font-size:.65rem; color:var(--fg2); margin-left:auto; }
.plan-hint { font-size:.68rem; color:var(--fg2); background:var(--bg3); border-radius:6px; padding:.4rem .55rem; margin-top:.5rem; line-height:1.5; }

/* ── Auth overlay ── */
#auth-ov { position:fixed; inset:0; background:var(--bg); z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.9rem; }
#auth-ov.gone { display:none; }
#auth-ov h2 { font-size:1.3rem; }
#auth-ov p { color:var(--fg2); font-size:.88rem; }
.g-btn { padding:.55rem 1.4rem; border-radius:8px; background:var(--cl); color:#fff; border:none; cursor:pointer; font-size:.95rem; font-weight:600; font-family:inherit; }
</style>
</head>
<body>

<div id="auth-ov">
  <div style="font-size:2.5rem">🏃‍♂️</div>
  <h2>Fitness</h2>
  <p>請登入 Google 帳號來同步你的訓練資料</p>
  <button class="g-btn" onclick="doSignIn()">登入 Google</button>
</div>

<div class="view-tabs">
  <button class="view-tab active" data-v="plan"   onclick="switchView('plan')">備賽計畫</button>
  <button class="view-tab"        data-v="cal"    onclick="switchView('cal')">訓練日誌</button>
  <button class="view-tab"        data-v="trends" onclick="switchView('trends')">趨勢分析</button>
</div>

<div id="stats-bar">
  <div class="stat"><span class="stat-val" id="s-wload">—</span><span>本週負荷</span></div>
  <div class="stat"><span class="stat-val" id="s-acwr">—</span><span>ACWR</span></div>
  <div class="stat"><span class="stat-val" id="s-sess">—</span><span>本週次數</span></div>
  <div id="race-cntdwn">🏆 — 天後・半馬 8/2</div>
</div>

<div id="main">
  <div id="v-plan">
    <div class="lsd-box"><h3>LSD 長跑進程</h3><div class="lsd-dots" id="lsd-dots"></div></div>
    <div id="weeks"></div>
  </div>
  <div id="v-cal" style="display:none">
    <div class="cal-nav">
      <button onclick="calMov(-1)">‹</button>
      <h2 id="cal-ttl"></h2>
      <button onclick="calMov(1)">›</button>
    </div>
    <div class="cal-dow-row" id="cal-dows"></div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>
  <div id="v-trends" style="display:none">
    <div class="metric-cards" id="metrics"></div>
    <div class="chart-box"><h3>週負荷趨勢（近12週）</h3><div id="ch-load"></div></div>
    <div class="chart-box"><h3>步頻趨勢（近10次跑步）</h3><div id="ch-cad"></div></div>
  </div>
</div>

<div id="ov" onclick="closePanel()"></div>
<div id="panel">
  <div id="phdr">
    <span id="p-date"></span><span id="p-plan"></span>
    <button id="p-close" onclick="closePanel()">✕</button>
  </div>
  <div id="pbody"></div>
  <div id="pftr">
    <button class="btn-d" id="p-del" onclick="delEntry()" style="display:none">刪除</button>
    <button class="btn-c" onclick="closePanel()">取消</button>
    <button class="btn-p" onclick="saveEntry()">儲存</button>
  </div>
</div>

<script type="module">
import { waitForGIS, getTokenClient, setToken, loadStoredToken, clearStoredToken, getAccessToken } from '../shared/auth.js';
import { createDriveStore } from '../shared/drive.js';
import { renderNav } from '../shared/nav.js';

// ── Plan Definition ──────────────────────────────────────────────────────────
const DEF = [
  { offset:0, type:'badminton', label:'羽球',      note:'1-2小時羽球' },
  { offset:1, type:'rest',      label:'休息',      note:'完全休息' },
  { offset:2, type:'intervals', label:'間歇+腿訓', note:'1km×4趟 配速6:45\n下肢重訓25分' },
  { offset:3, type:'strength',  label:'上肢+核心', note:'划船/胸推/肩推\n棒式撐體' },
  { offset:4, type:'easy',      label:'輕鬆跑',    note:'5-6km 7:15-7:30配速' },
  { offset:5, type:'rest',      label:'大充電',    note:'長跑前大休息\n多補水與碳水' },
  { offset:6, type:'lsd',       label:'LSD',       note:'' },
];

const PLAN = {
  raceDate: '2026-08-02',
  weeks: [
    { id:'w1', label:'第1週', start:'2026-06-15', lsdKm:11.3,  phase:'build',    lsdNote:'跑走法、低心率' },
    { id:'w2', label:'第2週', start:'2026-06-22', lsdKm:12.6,  phase:'build',    lsdNote:'練習補水/能量膠',
      note:'⚠️ 腸胃鏡週（6/25週四）週一停羽球，低渣飲食6/22–6/24',
      days:[
        { offset:0, type:'rest',      label:'停練',       note:'羽球停練 低渣飲食Day1' },
        { offset:1, type:'intervals', label:'間歇(降載)', note:'1km×4 嚴守6:45\n下肢重訓重量減半' },
        { offset:2, type:'rest',      label:'完全休息',   note:'低渣Day3 傍晚清腸' },
        { offset:3, type:'strength',  label:'鏡檢+上肢',  note:'🏥腸胃鏡\n晚上：上肢+核心' },
        { offset:4, type:'easy',      label:'輕鬆跑',     note:'5-6km 7:15-7:30配速' },
        { offset:5, type:'rest',      label:'大充電',     note:'長跑前大休息+碳水' },
        { offset:6, type:'lsd',       label:'LSD 12.6km', note:'練習補水/能量膠' },
      ]},
    { id:'w3', label:'第3週', start:'2026-06-29', lsdKm:14.0,  phase:'build',    lsdNote:'中高里程體感建立' },
    { id:'w4', label:'第4週', start:'2026-07-06', lsdKm:12.0,  phase:'recovery', lsdNote:'主動縮短、修復關節' },
    { id:'w5', label:'第5週', start:'2026-07-13', lsdKm:16.6,  phase:'peak',     lsdNote:'生涯最高峰、信心解鎖' },
    { id:'w6', label:'第6週', start:'2026-07-20', lsdKm:8.0,   phase:'taper',    lsdNote:'超級減量、保留體力',
      days:[
        { offset:0, type:'badminton', label:'羽球',        note:'1-2小時羽球' },
        { offset:1, type:'rest',      label:'休息',        note:'完全休息' },
        { offset:2, type:'intervals', label:'間歇(輕量)',  note:'1km×3趟輕鬆跑\n下肢極輕量維持' },
        { offset:3, type:'strength',  label:'上肢+核心',   note:'划船/胸推/肩推+棒式' },
        { offset:4, type:'easy',      label:'輕鬆跑',      note:'4-5km 7:15-7:30配速' },
        { offset:5, type:'rest',      label:'大充電',      note:'長跑前大休息+碳水' },
        { offset:6, type:'lsd',       label:'LSD 8.0km',   note:'超級減量' },
      ]},
    { id:'race', label:'賽前週', start:'2026-07-27', lsdKm:null, phase:'race',
      days:[
        { offset:0, type:'badminton', label:'羽球(輕)',    note:'1小時輕鬆打不拼球' },
        { offset:1, type:'rest',      label:'休息',        note:'完全休息' },
        { offset:2, type:'easy',      label:'輕鬆動',      note:'3km輕鬆動動' },
        { offset:3, type:'rest',      label:'拉筋',        note:'賽前大拉筋伸展' },
        { offset:4, type:'rest',      label:'休息',        note:'完全休息' },
        { offset:5, type:'rest',      label:'休息',        note:'完全休息' },
        { offset:6, type:'race',      label:'🏆 半馬正賽', note:'8/2 半馬\n目標2:30:00' },
      ]},
  ],
};

const EX_WED = [
  { k:'goblet',    lbl:'Goblet Squat',           info:'4組×12次' },
  { k:'bridge',    lbl:'Glute Bridge',            info:'4組×15次' },
  { k:'bulgarian', lbl:'Bulgarian Split Squat',   info:'每邊3組×10次' },
  { k:'birddog',   lbl:'Bird-Dog Crunch',         info:'每邊3組×10次' },
];
const EX_THU = [
  { k:'row',       lbl:'Dumbbell Row',            info:'4組×12次' },
  { k:'press',     lbl:'Floor Press',             info:'4組×12次' },
  { k:'shoulder',  lbl:'Seated Shoulder Press',   info:'3組×12次' },
  { k:'plank',     lbl:'Plank',                   info:'3組×40-60秒' },
];

// ── State ────────────────────────────────────────────────────────────────────
let data = {};
let store = null;
let calY = new Date().getFullYear(), calM = new Date().getMonth();
let pDate = null, pRpe = 0, pType = 'easy', pStat = 'done';

// ── Auth ─────────────────────────────────────────────────────────────────────
async function init() {
  renderNav('fitness');
  updateCountdown();
  renderPlan();

  const stored = loadStoredToken();
  if (stored) {
    await activateStore();
  } else {
    document.getElementById('auth-ov').classList.remove('gone');
  }
}

async function activateStore() {
  store = createDriveStore('fitness', () => document.getElementById('auth-ov').classList.remove('gone'));
  const y = new Date().getFullYear();
  const raw = await store.readJson(`${y}.json`);
  if (raw) data = raw;
  document.getElementById('auth-ov').classList.add('gone');
  renderAll();
}

async function doSignIn() {
  await waitForGIS();
  const tc = await getTokenClient();
  await new Promise(res => {
    tc.callback = resp => { setToken(resp); res(); };
    tc.requestAccessToken({ prompt: '' });
  });
  await activateStore();
}

async function saveYear(y) {
  if (!store) return;
  await store.writeJson(`${y}.json`, data, () => alert('儲存失敗'));
}

// ── Views ────────────────────────────────────────────────────────────────────
function switchView(v) {
  document.querySelectorAll('.view-tab').forEach(t => t.classList.toggle('active', t.dataset.v === v));
  document.getElementById('v-plan').style.display   = v === 'plan'   ? '' : 'none';
  document.getElementById('v-cal').style.display    = v === 'cal'    ? '' : 'none';
  document.getElementById('v-trends').style.display = v === 'trends' ? '' : 'none';
  if (v === 'cal') renderCal();
  if (v === 'trends') renderTrends();
}

function renderAll() { updateStats(); renderPlan(); }

// ── Stats bar ────────────────────────────────────────────────────────────────
function updateCountdown() {
  const d = Math.ceil((new Date(PLAN.raceDate) - new Date()) / 86400000);
  document.getElementById('race-cntdwn').textContent = `🏆 ${d} 天後・半馬 8/2`;
}

function updateStats() {
  updateCountdown();
  const mon = weekMonday(new Date());
  let wload = 0, sess = 0;
  for (let i = 0; i < 7; i++) {
    const dd = new Date(mon); dd.setDate(mon.getDate() + i);
    const k = toKey(dd);
    (data[k] || []).forEach(e => { wload += e.load || 0; if (e.status === 'done') sess++; });
  }
  document.getElementById('s-wload').textContent = wload || '—';
  document.getElementById('s-sess').textContent  = sess  || '—';
  const a7 = avgLoad(7), a28 = avgLoad(28);
  document.getElementById('s-acwr').textContent = a28 > 0 ? (a7 / a28).toFixed(2) : '—';
}

function avgLoad(days) {
  let t = 0;
  const now = new Date();
  for (let i = 0; i < days; i++) {
    const d = new Date(now); d.setDate(now.getDate() - i);
    (data[toKey(d)] || []).forEach(e => t += e.load || 0);
  }
  return t / days;
}

// ── Plan View ────────────────────────────────────────────────────────────────
function renderPlan() {
  renderLSD();
  const tod = todayStr();
  const DOW = ['一','二','三','四','五','六','日'];

  document.getElementById('weeks').innerHTML = PLAN.weeks.map(w => {
    const days = weekDays(w);
    const isCur = tod >= w.start && tod <= addD(w.start, 6);
    const isPast = addD(w.start, 6) < tod;
    const phLbl = { build:'累積期', recovery:'修復週', peak:'高峰週', taper:'減量期', race:'賽週' }[w.phase];

    const cells = days.map((d, i) => {
      const dateStr = addD(w.start, d.offset);
      const entries = data[dateStr] || [];
      const entry = entries.find(e => e.status !== 'skip');
      const isToday = dateStr === tod;
      const hasDist = entry?.metrics?.distance;
      const hasDur  = entry?.duration;

      let badge = '', actual = '';
      if (entry) {
        badge  = `<span class="dc-badge">✓</span>`;
        actual = hasDist ? `<span class="dc-actual">${entry.metrics.distance}km</span>` :
                 hasDur  ? `<span class="dc-actual">${entry.duration}'</span>` : '';
      }
      const icons = { badminton:'🏸', rest:'💤', intervals:'🏃', strength:'💪', easy:'🚶', lsd:'🏁', race:'🏆' };
      const cls = `dc type-${d.type}${isToday ? ' today' : ''}${entry ? ' has-entry' : ''}`;

      return `<div class="${cls}" onclick="openPanel('${dateStr}')">
        <span class="dc-date">${dateStr.slice(5)}</span>
        <span class="dc-icon">${icons[d.type] || '📋'}</span>
        <span class="dc-label">${d.label}</span>
        ${badge}${actual}
        <div class="dc-bar"></div>
      </div>`;
    }).join('');

    const open = isCur || isPast ? 'open' : '';
    return `<div class="week-card ${isCur ? 'cur' : ''} ${open}" id="wc-${w.id}">
      <div class="wk-hdr" onclick="togWk('wc-${w.id}')">
        <span class="wk-title">${w.label}</span>
        <span class="wk-dates">${w.start} – ${addD(w.start,6)}</span>
        <span class="wk-phase ph-${w.phase}">${phLbl}</span>
        ${w.lsdKm ? `<span class="wk-lsd-tag">LSD ${w.lsdKm}km</span>` : ''}
        <span class="wk-chev">›</span>
      </div>
      <div class="wk-body">
        ${w.note ? `<div class="wk-note">${w.note}</div>` : ''}
        <div class="day-hdr-row">${DOW.map(h => `<div class="day-hdr">${h}</div>`).join('')}</div>
        <div class="day-grid">${cells}</div>
      </div>
    </div>`;
  }).join('');
}

function renderLSD() {
  const tod = todayStr();
  const lsdWeeks = PLAN.weeks.filter(w => w.lsdKm);
  const maxKm = Math.max(...lsdWeeks.map(w => w.lsdKm));

  document.getElementById('lsd-dots').innerHTML = lsdWeeks.map(w => {
    const lsdDate = addD(w.start, 6);
    const isPast  = lsdDate < tod;
    const isCur   = tod >= w.start && tod <= lsdDate;
    const entry   = (data[lsdDate] || []).find(e => e.type === 'lsd' && e.status !== 'skip');
    const actual  = entry?.metrics?.distance;
    const pct     = (w.lsdKm / maxKm) * 100;
    const cls     = isPast ? (actual ? 'done' : 'future') : isCur ? 'current' : w.phase;

    return `<div class="lsd-dot" onclick="openPanel('${lsdDate}')">
      <div class="lsd-bar-area">
        <div class="lsd-bar ${cls}" style="height:${pct}%">
          ${actual ? `<span style="position:absolute;top:-1rem;left:0;right:0;text-align:center;font-size:.55rem;color:var(--ce)">✓</span>` : ''}
        </div>
      </div>
      <div class="lsd-km">${w.lsdKm}</div>
      <div class="lsd-wlabel">${w.label}</div>
      ${actual ? `<div class="lsd-actual-km">${actual}km</div>` : ''}
    </div>`;
  }).join('');
}

// ── Calendar View ─────────────────────────────────────────────────────────────
function renderCal() {
  document.getElementById('cal-ttl').textContent = `${calY}年 ${calM + 1}月`;
  const DOWS = ['日','一','二','三','四','五','六'];
  document.getElementById('cal-dows').innerHTML = DOWS.map(d => `<div class="cal-dow">${d}</div>`).join('');

  const first = new Date(calY, calM, 1).getDay();
  const last  = new Date(calY, calM + 1, 0).getDate();
  const tod   = todayStr();
  let html = '';
  for (let i = 0; i < first; i++) html += '<div></div>';
  for (let d = 1; d <= last; d++) {
    const k = `${calY}-${p2(calM+1)}-${p2(d)}`;
    const entries = (data[k] || []).filter(e => e.status !== 'skip');
    const chips = entries.map(e => {
      const txt = e.metrics?.distance ? `${e.metrics.distance}km` : e.duration ? `${e.duration}'` : e.type;
      return `<span class="cc" style="background:${tc(e.type)}">${txt}</span>`;
    }).join('');
    html += `<div class="cal-day${k===tod?' today':''}" onclick="openPanel('${k}')">
      <div class="dn">${d}</div><div class="cal-chips">${chips}</div>
    </div>`;
  }
  document.getElementById('cal-grid').innerHTML = html;
}

function calMov(d) { calM += d; if (calM > 11) { calM=0; calY++; } if (calM < 0) { calM=11; calY--; } renderCal(); }

// ── Trends View ───────────────────────────────────────────────────────────────
function renderTrends() {
  const runs = [];
  Object.entries(data).sort().forEach(([date, arr]) => {
    arr.forEach(e => {
      if (['easy','lsd','intervals'].includes(e.type) && e.status !== 'skip') runs.push({ date, ...e });
    });
  });

  const last = runs[runs.length - 1];
  const prev = runs[runs.length - 2];
  const mets = [
    { k:'avgCadence',             lbl:'步頻',   unit:'spm', src: e => e?.metrics?.avgCadence },
    { k:'avgStrideLength',        lbl:'步幅',   unit:'cm',  src: e => e?.metrics?.avgStrideLength },
    { k:'avgHR',                  lbl:'平均心率',unit:'bpm', src: e => e?.metrics?.avgHR },
    { k:'avgVerticalOscillation', lbl:'垂直振幅',unit:'cm',  src: e => e?.metrics?.avgVerticalOscillation },
    { k:'avgGroundContactTime',   lbl:'觸地時間',unit:'ms',  src: e => e?.metrics?.avgGroundContactTime },
    { k:'distance',               lbl:'距離',   unit:'km',  src: e => e?.metrics?.distance },
  ];

  document.getElementById('metrics').innerHTML = mets.map(m => {
    const v = m.src(last), p = m.src(prev);
    const disp = v != null ? (Number.isInteger(v) ? v : (+v).toFixed(1)) : '—';
    let delta = '';
    if (v != null && p != null) {
      const diff = v - p, s = diff > 0 ? '+' : '';
      const cl = diff > 0 ? 'color:var(--ce)' : 'color:#ef4444';
      delta = `<div style="font-size:.65rem;${cl}">${s}${Number.isInteger(diff)?diff:diff.toFixed(1)}</div>`;
    }
    return `<div class="mc"><div class="mc-lbl">${m.lbl}</div><div class="mc-val">${disp}<span class="mc-unit"> ${v!=null?m.unit:''}</span></div>${delta}</div>`;
  }).join('');

  // 12-week load
  const now = new Date();
  const wks = Array.from({length:12}, (_, i) => {
    const d = new Date(now); d.setDate(now.getDate() - (11-i)*7);
    const mon = weekMonday(d);
    let load = 0;
    for (let j = 0; j < 7; j++) {
      const dd = new Date(mon); dd.setDate(mon.getDate() + j);
      (data[toKey(dd)] || []).forEach(e => load += e.load || 0);
    }
    return { lbl:`${mon.getMonth()+1}/${mon.getDate()}`, v: load };
  });
  document.getElementById('ch-load').innerHTML = barChart(wks.map(w=>w.lbl), wks.map(w=>w.v), { color:'var(--cl)' });

  // cadence
  const r10 = runs.slice(-10);
  document.getElementById('ch-cad').innerHTML = r10.length ?
    barChart(r10.map(r=>r.date.slice(5)), r10.map(r=>r.metrics?.avgCadence||0), { color:'var(--ce)', ref:170, refLbl:'170spm' }) :
    '<p style="color:var(--fg2);font-size:.8rem;text-align:center;padding:1rem">尚無跑步資料</p>';
}

function barChart(lbls, vals, { color='var(--cl)', ref, refLbl }={}) {
  const W=580, H=110, n=lbls.length; if (!n) return '';
  const max = Math.max(...vals, 1);
  const bw = Math.max(4, Math.floor((W-20)/n) - 5);
  const bars = lbls.map((l, i) => {
    const bh = (vals[i]/max)*H, x = 10 + i*((W-20)/n);
    return `<rect x="${x}" y="${H-bh}" width="${bw}" height="${bh}" fill="${color}" rx="2" opacity=".82"/>
      <text x="${x+bw/2}" y="${H+13}" text-anchor="middle" font-size="8" fill="var(--fg2)">${l}</text>
      ${vals[i]>0?`<text x="${x+bw/2}" y="${H-bh-3}" text-anchor="middle" font-size="8" fill="var(--fg)">${vals[i]}</text>`:''}`;
  }).join('');
  const refLine = ref ? `<line x1="10" y1="${H-(ref/max)*H}" x2="${W-10}" y2="${H-(ref/max)*H}" stroke="var(--crace)" stroke-dasharray="4 3" stroke-width="1"/>
    <text x="${W-10}" y="${H-(ref/max)*H-4}" text-anchor="end" font-size="8" fill="var(--crace)">${refLbl}</text>` : '';
  return `<svg viewBox="0 0 ${W} ${H+18}">${bars}${refLine}</svg>`;
}

// ── Panel ─────────────────────────────────────────────────────────────────────
function openPanel(dateStr) {
  pDate = dateStr;
  const entries = data[dateStr] || [];
  const entry   = entries[0] || null;
  const planned = getPlanned(dateStr);

  pRpe  = entry?.rpe  || 0;
  pType = entry?.type || planned?.type || 'easy';
  pStat = entry?.status || 'done';

  document.getElementById('p-date').textContent = dateStr;
  document.getElementById('p-plan').textContent = planned ? ` · ${planned.label}` : '';
  document.getElementById('p-del').style.display = entry ? '' : 'none';

  const isRun = ['easy','lsd','intervals'].includes(pType);
  const isStr = ['intervals','strength'].includes(pType);
  const exList = pType === 'intervals' ? EX_WED : EX_THU;
  const done = entry?.metrics?.strengthDone || [];

  document.getElementById('pbody').innerHTML = `
    <div class="fr"><label>狀態</label>
      <div class="stat-row">
        <button class="sb done ${pStat==='done'?'on':''}"    onclick="setStat('done')">✓ 完成</button>
        <button class="sb done ${pStat==='partial'?'on':''}" onclick="setStat('partial')">~ 部分</button>
        <button class="sb skip ${pStat==='skip'?'on':''}"    onclick="setStat('skip')">✕ 跳過</button>
      </div>
    </div>
    <div class="fr"><label>類型</label>
      <div class="type-row">
        ${['badminton','intervals','strength','easy','lsd','rest','other'].map(t =>
          `<button class="tb ${pType===t?'on':''}" data-v="${t}" onclick="setType('${t}')">${typeIco(t)}</button>`
        ).join('')}
      </div>
    </div>
    <div class="two-col">
      <div class="fr"><label>時長（分鐘）</label><input type="number" id="f-dur" value="${entry?.duration||''}" oninput="calcLoad()"></div>
      <div class="fr"><label>Load（自動）</label><input id="f-load" readonly value="${entry?.load||''}"></div>
    </div>
    <div class="fr"><label>RPE 主觀費力度</label>
      <div class="rpe-row">${Array.from({length:10},(_,i)=>i+1).map(n =>
        `<button class="rb ${pRpe===n?'on':''}" onclick="setRpe(${n})">${n}</button>`
      ).join('')}</div>
    </div>
    <details class="coll" ${isRun?'open':''}>
      <summary>跑步數據</summary>
      <div class="two-col" style="margin-top:.4rem">
        <div class="fr"><label>距離 (km)</label><input type="number" step=".01" id="f-dist" value="${entry?.metrics?.distance||''}"></div>
        <div class="fr"><label>平均配速</label><input type="text" id="f-pace" placeholder="7:30" value="${entry?.metrics?.avgPace||''}"></div>
        <div class="fr"><label>平均心率 (bpm)</label><input type="number" id="f-hr" value="${entry?.metrics?.avgHR||''}"></div>
        <div class="fr"><label>步頻 (spm)</label><input type="number" id="f-cad" value="${entry?.metrics?.avgCadence||''}"></div>
        <div class="fr"><label>步幅 (cm)</label><input type="number" id="f-strd" value="${entry?.metrics?.avgStrideLength||''}"></div>
        <div class="fr"><label>垂直振幅 (cm)</label><input type="number" step=".1" id="f-vosc" value="${entry?.metrics?.avgVerticalOscillation||''}"></div>
        <div class="fr"><label>觸地時間 (ms)</label><input type="number" id="f-gct" value="${entry?.metrics?.avgGroundContactTime||''}"></div>
        <div class="fr"><label>垂直效率 (%)</label><input type="number" step=".1" id="f-vr" value="${entry?.metrics?.avgVerticalRatio||''}"></div>
      </div>
    </details>
    ${isStr ? `<details class="coll" open>
      <summary>${pType==='intervals'?'週三 下肢重訓清單':'週四 上肢核心清單'}</summary>
      <ul class="ex-list">${exList.map(ex =>
        `<li><input type="checkbox" id="ex-${ex.k}" ${done.includes(ex.k)?'checked':''}>
          <label for="ex-${ex.k}">${ex.lbl}</label><span class="ex-sets">${ex.info}</span></li>`
      ).join('')}</ul>
    </details>` : ''}
    <div class="fr"><label>備註</label><textarea id="f-note">${entry?.note||''}</textarea></div>
    ${planned ? `<div class="plan-hint">📋 計畫：${planned.note?.replace(/\n/g,'<br>')||planned.label}</div>` : ''}
  `;

  document.getElementById('panel').classList.add('open');
  document.getElementById('ov').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('ov').classList.remove('open');
  document.body.style.overflow = '';
  pDate = null;
}

function setStat(s) {
  pStat = s;
  document.querySelectorAll('.sb').forEach(b => {
    const match = (s==='done'&&b.textContent.includes('完成')) || (s==='partial'&&b.textContent.includes('部分')) || (s==='skip'&&b.textContent.includes('跳過'));
    b.classList.toggle('on', match);
  });
}

function setType(t) {
  pType = t;
  document.querySelectorAll('.tb').forEach(b => b.classList.toggle('on', b.dataset.v === t));
}

function setRpe(n) {
  pRpe = n;
  document.querySelectorAll('.rb').forEach(b => b.classList.toggle('on', parseInt(b.textContent)===n));
  calcLoad();
}

function calcLoad() {
  const dur = parseInt(document.getElementById('f-dur')?.value) || 0;
  const el = document.getElementById('f-load');
  if (el) el.value = dur * pRpe || '';
}

async function saveEntry() {
  if (!pDate) return;
  const dur  = parseInt(document.getElementById('f-dur').value) || 0;
  const note = document.getElementById('f-note').value.trim();

  const metrics = {};
  const g = (id, parse) => { const el = document.getElementById(id); return el?.value ? parse(el.value) : null; };
  const dist = g('f-dist', parseFloat); if (dist) metrics.distance = dist;
  const pace = g('f-pace', v=>v);      if (pace) metrics.avgPace = pace;
  const hr   = g('f-hr',  parseInt);   if (hr)   metrics.avgHR = hr;
  const cad  = g('f-cad', parseInt);   if (cad)  metrics.avgCadence = cad;
  const strd = g('f-strd',parseInt);   if (strd) metrics.avgStrideLength = strd;
  const vosc = g('f-vosc',parseFloat); if (vosc) metrics.avgVerticalOscillation = vosc;
  const gct  = g('f-gct', parseInt);   if (gct)  metrics.avgGroundContactTime = gct;
  const vr   = g('f-vr',  parseFloat); if (vr)   metrics.avgVerticalRatio = vr;

  const done = [...EX_WED, ...EX_THU].filter(ex => document.getElementById(`ex-${ex.k}`)?.checked).map(ex=>ex.k);
  if (done.length) metrics.strengthDone = done;

  const existing = (data[pDate] || [])[0];
  const entry = {
    id: existing?.id || (Date.now().toString(36) + Math.random().toString(36).slice(2,5)),
    time: new Date().toTimeString().slice(0,5),
    type: pType, duration: dur, rpe: pRpe,
    load: dur * pRpe, status: pStat, note, metrics,
  };

  data[pDate] = [entry];
  await saveYear(parseInt(pDate.slice(0,4)));
  closePanel();
  renderAll();
}

async function delEntry() {
  if (!pDate || !data[pDate]) return;
  delete data[pDate];
  await saveYear(parseInt(pDate.slice(0,4)));
  closePanel();
  renderAll();
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function p2(n) { return String(n).padStart(2,'0'); }
function fmtDate(d) { return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; }
function todayStr() { return fmtDate(new Date()); }
function toKey(d)   { return fmtDate(d); }

function addD(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return fmtDate(d);
}

function weekMonday(d) {
  const day = d.getDay();
  const mon = new Date(d);
  mon.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  return mon;
}

function weekDays(w) {
  return w.days || DEF.map(d => ({
    ...d,
    label: d.type === 'lsd' ? `LSD ${w.lsdKm}km` : d.label,
    note:  d.type === 'lsd' ? w.lsdNote : d.note,
  }));
}

function getPlanned(dateStr) {
  for (const w of PLAN.weeks) {
    const days = weekDays(w);
    for (const d of days) {
      if (addD(w.start, d.offset) === dateStr) return d;
    }
  }
  return null;
}

function tc(type) {
  return { badminton:'#f97316', rest:'#4b5563', intervals:'#ef4444', strength:'#8b5cf6', easy:'#10b981', lsd:'#3b82f6', race:'#f59e0b' }[type] || '#6b7280';
}

function typeIco(t) {
  return { badminton:'🏸羽球', rest:'💤休息', intervals:'🏃間歇', strength:'💪重訓', easy:'🚶輕跑', lsd:'🏁LSD', other:'📝其他' }[t] || t;
}

function togWk(id) { document.getElementById(id).classList.toggle('open'); }

// ── Keyboard ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePanel();
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') saveEntry();
});

Object.assign(window, { doSignIn, switchView, calMov, openPanel, closePanel, saveEntry, delEntry, setRpe, setType, setStat, togWk, calcLoad });

init().catch(console.error);
</script>
</body>
